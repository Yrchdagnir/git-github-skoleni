<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Krokový průvodce školením Git a GitHub v alchymistické dílně">
  <title>Průvodce školením | Git a GitHub</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="workshop-header">
    <a class="workshop-brand" href="../" aria-label="Archiv lektvarů">
      <img src="../assets/potions/echo-lantern.png" alt="">
      <span><small id="brand-context">Alchymistická dílna</small><strong>Git &amp; GitHub</strong></span>
    </a>
    <div class="header-actions">
      <div class="language-switch" role="group" aria-label="Jazyk / Jazyk">
        <button type="button" data-locale="cs" aria-pressed="true">Čeština</button>
        <button type="button" data-locale="sk" aria-pressed="false">Slovenčina</button>
      </div>
      <a class="icon-link" href="https://github.com/Yrchdagnir/git-github-skoleni" target="_blank" rel="noreferrer" aria-label="GitHub" title="GitHub">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.87c-2.78.6-3.37-1.18-3.37-1.18-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.9 1.53 2.35 1.09 2.92.83.09-.65.35-1.09.64-1.34-2.22-.25-4.56-1.11-4.56-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02A9.6 9.6 0 0 1 12 6.82a9.6 9.6 0 0 1 2.5.34c1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.77c0 .27.18.58.69.48A10 10 0 0 0 12 2Z"/></svg>
      </a>
    </div>
  </header>

  <div class="mobile-view-switch" role="tablist" aria-label="Zobrazení">
    <button type="button" data-mobile-view="lesson" role="tab" aria-selected="true">Kapitola</button>
    <button type="button" data-mobile-view="cheatsheet" role="tab" aria-selected="false">Tahák</button>
  </div>

  <div class="workshop-shell">
    <aside class="chapter-sidebar" aria-label="Kapitoly školení">
      <div class="progress-summary">
        <div><span id="progress-label">Postup</span><strong id="progress-value">0 / 0</strong></div>
        <progress id="progress-bar" value="0" max="1"></progress>
      </div>
      <nav id="chapter-nav"></nav>
      <button id="reset-progress" class="text-button danger-button" type="button">Resetovat postup</button>
    </aside>

    <main id="lesson-panel" class="lesson-panel" tabindex="-1">
      <div class="lesson-heading">
        <p id="lesson-chapter" class="eyebrow"></p>
        <div class="lesson-title-row">
          <h1 id="lesson-title"></h1>
          <span id="lesson-duration" class="duration"></span>
        </div>
        <p id="lesson-summary" class="lesson-summary"></p>
      </div>

      <section class="content-section" aria-labelledby="theory-title">
        <h2 id="theory-title">Nejdřív si ujasníme</h2>
        <div id="lesson-theory" class="prose"></div>
      </section>

      <section id="commands-section" class="content-section" aria-labelledby="commands-title">
        <h2 id="commands-title">Příkazy</h2>
        <div id="lesson-commands" class="command-list"></div>
      </section>

      <section class="content-section task-section" aria-labelledby="task-title">
        <h2 id="task-title">Praktický úkol</h2>
        <div id="lesson-task" class="prose"></div>
      </section>

      <section class="content-section result-grid" aria-label="Kontrola úkolu">
        <div>
          <h2 id="expected-title">Očekávaný výsledek</h2>
          <div id="lesson-expected" class="prose"></div>
        </div>
        <div>
          <h2 id="errors-title">Když se něco nedaří</h2>
          <div id="lesson-errors" class="prose"></div>
        </div>
      </section>

      <section class="check-section" aria-labelledby="check-title">
        <div>
          <p id="check-label" class="eyebrow">Kontrolní otázka</p>
          <h2 id="check-title"></h2>
        </div>
        <label class="completion-check">
          <input id="complete-step" type="checkbox">
          <span id="complete-label">Tomuto kroku rozumím</span>
        </label>
      </section>

      <nav class="lesson-pagination" aria-label="Pohyb mezi kroky">
        <button id="previous-step" class="nav-button" type="button">← Předchozí</button>
        <button id="next-step" class="nav-button primary" type="button">Další →</button>
      </nav>
    </main>

    <aside id="cheatsheet-panel" class="cheatsheet" aria-label="Git tahák">
      <div class="cheatsheet-header">
        <div><p class="eyebrow" id="cheatsheet-eyebrow">Po ruce</p><h2 id="cheatsheet-title">Git tahák</h2></div>
        <label class="search-field">
          <span class="sr-only" id="search-label">Hledat v taháku</span>
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>
          <input id="cheatsheet-search" type="search" placeholder="Hledat příkaz…">
        </label>
      </div>
      <div id="cheatsheet-content"></div>
      <p id="cheatsheet-empty" class="empty-state" hidden>Žádný příkaz neodpovídá hledání.</p>
    </aside>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
